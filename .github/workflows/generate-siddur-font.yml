name: Generate Siddur Hebrew font

on:
  push:
    branches: [siddur-phase-2]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: siddur-phase-2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install font tools
        run: python -m pip install freetype-py fonttools zopfli
      - name: Generate pointed Hebrew font
        run: |
          python lib/EpdFont/scripts/fontconvert.py \
            siddur_hebrew_16_regular \
            16 \
            lib/EpdFont/builtinFonts/source/NotoSansHebrew/NotoSansHebrew-Regular.ttf \
            --additional-intervals 0x0591,0x05F4 \
            --2bit \
            --compress \
            --zopfli \
            > lib/EpdFont/builtinFonts/siddur_hebrew_16_regular.h
      - name: Commit generated font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/EpdFont/builtinFonts/siddur_hebrew_16_regular.h
          git diff --cached --quiet && exit 0
          git commit -m "build(siddur): add generated Hebrew font"
          git push origin HEAD:siddur-phase-2
